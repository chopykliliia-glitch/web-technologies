<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Хімічні та математичні формули</title>
</head>

<body>

    <h1>Хімічні та математичні формули</h1>

    <ol>

        <li>
            Вода:
            <em>H<sub>2</sub>O</em>
        </li>

        <li>
            Сірчана кислота:
            <em>H<sub>2</sub>SO<sub>4</sub></em>
        </li>

        <li>
            Глюкоза:
            <em>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></em>
        </li>

        <li>
            Карбонат кальцію:
            <em>CaCO<sub>3</sub></em>
        </li>

        <li>
            Реакція горіння метану:
            <em>CH<sub>4</sub> + 2O<sub>2</sub> → CO<sub>2</sub> + 2H<sub>2</sub>O</em>
        </li>

        <li>
            Квадратне рівняння:
            <em>ax<sup>2</sup> + bx + c = 0</em>
        </li>

        <li>
            Число Авогадро:
            <em>6,022 · 10<sup>23</sup> моль<sup>−1</sup></em>
        </li>

    </ol>

</body>

</html>

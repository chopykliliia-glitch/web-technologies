<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторна №6 — Завдання 5. Погода</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <div class="weather">

       
        <div class="forecast">
            <ul class="days">
                <li><span class="day">Mon</span><span class="temp">17°</span></li>
                <li><span class="day">Tue</span><span class="temp">19°</span></li>
                <li><span class="day">Wed</span><span class="temp">16°</span></li>
                <li><span class="day">Thu</span><span class="temp">18°</span></li>
                <li><span class="day">Fri</span><span class="temp">21°</span></li>
            </ul>
        </div>

        <!-- Чорна картка з поточною температурою -->
        <div class="today">
            <span class="temp-now">17</span>
        </div>

        <!-- Стрілки -->
        <div class="arrows">
            <button class="arrow arrow-prev" type="button" aria-label="Назад">&larr;</button>
            <button class="arrow arrow-next" type="button" aria-label="Вперед">&rarr;</button>
        </div>

        <!-- Хмара -->
        <div class="cloud">
            <i></i><i></i><i></i><i></i><i></i>
        </div>

    </div>

</body>
</html>

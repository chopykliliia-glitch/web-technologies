
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тарифні плани</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Оберіть тариф</th>
                <th>Старт<br>10$</th>
                <th>Економ<br>20$</th>
                <th>Стандарт<br>40$</th>
                <th>Профі<br>60$</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Підтримка на пошті</th>
                <td>+</td>
                <td>+</td>
                <td>+</td>
                <td>+</td>
            </tr>
            <tr>
                <th scope="row">Хмарне сховище</th>
                <td>+</td>
                <td>+</td>
                <td>+</td>
                <td>+</td>
            </tr>
            <tr>
                <th scope="row">Власний домен</th>
                <td>-</td>
                <td>-</td>
                <td>+</td>
                <td>+</td>
            </tr>
            <tr>
                <th scope="row">Аналітика</th>
                <td>-</td>
                <td>+</td>
                <td>-</td>
                <td>+</td>
            </tr>
            <tr>
                <th scope="row">Особистий менеджер</th>
                <td>-</td>
                <td>-</td>
                <td>+</td>
                <td>+</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
